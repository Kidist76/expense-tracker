{% extends "base.html" %}

{% block content %}
<style>
    .method-selector {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        border-bottom: 2px solid #e0e0e0;
        padding-bottom: 10px;
    }
    .method-btn {
        padding: 10px 20px;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 16px;
        color: #666;
        transition: all 0.3s;
    }
    .method-btn.active {
        color: #2e7d32;
        border-bottom: 3px solid #2e7d32;
        font-weight: bold;
    }
    .form-container {
        background: #f9f9f9;
        padding: 25px;
        border-radius: 10px;
        max-width: 500px;
        margin: 0 auto;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #333;
    }
    .form-group input, .form-group select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
    }
    .btn-submit {
        background: #2e7d32;
        color: white;
        padding: 12px 30px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        width: 100%;
    }
    .btn-submit:hover {
        background: #1b5e20;
    }
    .btn-add-category {
        background: #6c757d;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        width: auto;
    }
    .btn-add-category:hover {
        background: #5a6268;
    }
    .ocr-preview {
        margin-top: 20px;
        padding: 15px;
        background: #fff;
        border: 1px dashed #ddd;
        border-radius: 5px;
        text-align: center;
    }
    .category-row {
        display: flex;
        gap: 10px;
        align-items: center;
    }
    .category-row select {
        flex: 1;
    }
    .new-category-row {
        margin-top: 10px;
        display: flex;
        gap: 10px;
    }
    .new-category-row input {
        flex: 1;
    }
    .hidden {
        display: none;
    }
    /* Loading overlay for OCR */
.loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}
.loading-spinner {
    background: white;
    padding: 20px 30px;
    border-radius: 10px;
    text-align: center;
}
.loading-spinner i {
    font-size: 40px;
    color: #2e7d32;
    margin-bottom: 10px;
}
</style>

<div class="container">
    <h2>➕ Add New Expense</h2>

    <div class="method-selector">
        <button class="method-btn active" onclick="showMethod('manual')">✏️ Manual Entry</button>
        <button class="method-btn" onclick="showMethod('ocr')">📷 Upload Screenshot (OCR)</button>
    </div>

    <!-- Manual Entry Form -->
    <div id="manual-form" class="form-container">
        <form method="POST" action="{{ url_for('add_expense') }}" id="expenseForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label>💰 Amount (Birr):</label>
                <input type="number" name="amount" step="0.01" required placeholder="e.g., 500.00">
            </div>

            <div class="form-group">
                <label>📝 Description:</label>
                <input type="text" name="description" required placeholder="e.g., Lunch, Taxi, Shopping">
            </div>

            <div class="form-group">
                <label>📅 Date:</label>
                <input type="date" name="date" required>
            </div>

            <div class="form-group">
                <label>🏷️ Category:</label>
                <div class="category-row">
                    <select name="category" id="categorySelect">
                        <option value="Other" selected>🤖 Let AI Categorize (Recommended)</option>
                        <option value="Food">🥘 Food</option>
                        <option value="Transport">🚗 Transport</option>
                        <option value="Utilities">💡 Utilities</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Healthcare">🏥 Healthcare</option>
                        <option value="Education">📚 Education</option>
                        <option value="Rent">🏠 Rent</option>
                        <option value="Entertainment">🎬 Entertainment</option>
                        {% if user_categories %}
                            {% for cat in user_categories %}
                            <option value="{{ cat.name }}">📌 {{ cat.name }}</option>
                            {% endfor %}
                        {% endif %}
                        <option value="__new__" style="color: #2e7d32; font-weight: bold;">➕ Add New Category...</option>
                    </select>
                </div>

                <!-- New Category Input (hidden by default) -->
                <div id="newCategoryDiv" class="hidden">
                    <div class="new-category-row">
                        <input type="text" id="newCategoryName" placeholder="Enter new category name (max 50 characters)">
                        <button type="button" id="confirmNewCategory" class="btn-add-category">➕ Add</button>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">💾 Save Expense</button>
        </form>
    </div>

    <!-- OCR Upload Form -->
    <div id="ocr-form" class="form-container" style="display:none">
        <form method="POST" action="{{ url_for('upload_ocr') }}" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>📸 Upload Screenshot:</label>
                <input type="file" name="screenshot" accept="image/*,.png,.jpg,.jpeg" required>
                <small>Upload bank SMS or receipt screenshot</small>
            </div>

            <button type="submit" class="btn-submit">🔍 Extract with OCR</button>
        </form>

        <div class="ocr-preview">
            <i class="fas fa-info-circle"></i>
            <p>Supported formats: PNG, JPG, JPEG</p>
            <p>OCR will automatically extract: Amount, Date, Description</p>
        </div>
    </div>
</div>

<script>
// ── Show/hide manual vs OCR tabs ──────────────────────────────
function showMethod(method) {
  document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('manual-form').style.display = method === 'manual' ? 'block' : 'none';
  document.getElementById('ocr-form').style.display    = method === 'ocr'    ? 'block' : 'none';
}

// ── New-category dropdown ──────────────────────────────────────
document.getElementById('categorySelect').addEventListener('change', function () {
  const div = document.getElementById('newCategoryDiv');
  if (this.value === '__new__') {
    div.classList.remove('hidden');
    document.getElementById('newCategoryName').focus();
  } else {
    div.classList.add('hidden');
    document.getElementById('newCategoryName').value = '';
  }
});

document.getElementById('confirmNewCategory').addEventListener('click', function () {
  const name = document.getElementById('newCategoryName').value.trim();
  if (!name)            { showBanner('❌ Please enter a category name', 'danger'); return; }
  if (name.length > 50) { showBanner('❌ Category name must be 50 characters or less', 'danger'); return; }

  const select = document.getElementById('categorySelect');
  for (let i = 0; i < select.options.length; i++) {
    if (select.options[i].value === name) { showBanner('⚠️ Category already exists', 'warning'); return; }
  }

  fetch('/add_category_ajax', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token() }}' },
    body: JSON.stringify({ category_name: name })
  })
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      const opt = new Option('📌 ' + data.category_name, data.category_name);
      select.insertBefore(opt, select.options[select.options.length - 1]);
      select.value = data.category_name;
      document.getElementById('newCategoryDiv').classList.add('hidden');
      document.getElementById('newCategoryName').value = '';
      showBanner('✅ Category added!', 'success');
    } else {
      showBanner('❌ ' + data.error, 'danger');
    }
  })
  .catch(() => showBanner('❌ Failed to add category. Please try again.', 'danger'));
});

// ── OCR form loading overlay ───────────────────────────────────
const ocrForm = document.querySelector('#ocr-form form');
if (ocrForm) {
  ocrForm.addEventListener('submit', function () {
    const overlay = document.getElementById('loadingOverlay');
    if (overlay) overlay.style.display = 'flex';
    const btn = this.querySelector('button[type="submit"]');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...'; }
  });
}

// ── Default date ───────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function () {
  const dateInput = document.querySelector('input[name="date"]');
  if (dateInput && !dateInput.value)
    dateInput.value = new Date().toISOString().split('T')[0];
});

//  EXPENSE FORM – single unified submit handler

const expenseForm = document.getElementById('expenseForm');
const submitBtn   = expenseForm?.querySelector('button[type="submit"]');

if (expenseForm) {
  expenseForm.addEventListener('submit', async function (e) {
    e.preventDefault();   // always intercept — we decide whether to POST

    const online = await isReallyOnline();

    if (!online) {
      // ── OFFLINE: queue in IndexedDB ──────────────────────
      const data = {};
      new FormData(expenseForm).forEach((v, k) => { if (k !== 'csrf_token') data[k] = v; });

      const saved = await saveToIDB('pending-expenses', data);
      if (saved) {
        if ('serviceWorker' in navigator && 'SyncManager' in window) {
          const reg = await navigator.serviceWorker.ready;
          await reg.sync.register('sync-expenses');
        }
        showBanner('📱 Saved offline – will sync when you reconnect.', 'warning');
        expenseForm.reset();
        const dateInput = document.querySelector('input[name="date"]');
        if (dateInput) dateInput.value = new Date().toISOString().split('T')[0];
      } else {
        showBanner('❌ Could not save offline. Please try again.', 'danger');
      }

    } else {
      // ── ONLINE: submit normally, bust stale SW cache first ──
      bustPageCache(['/dashboard', '/transactions']);
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = '⏳ Saving…'; }
      expenseForm.submit();
    }
  });
}

// ── Trigger sync when back online ─────────────────────────────
window.addEventListener('online', async () => {
  bustPageCache(['/dashboard', '/transactions']);
  if ('serviceWorker' in navigator && 'SyncManager' in window) {
    const reg = await navigator.serviceWorker.ready;
    reg.sync.register('sync-expenses');
    reg.sync.register('sync-debts');
  }
});


//  SHARED UTILITIES

/**
 * Real connectivity check: probes /manifest.json with no-cache.
 * navigator.onLine returns true even with captive portals / bad signal.
 */
async function isReallyOnline() {
  try {
    const r = await fetch('/manifest.json', {
      method: 'HEAD',
      cache: 'no-store',
      signal: AbortSignal.timeout(3000)
    });
    return r.ok;
  } catch {
    return false;
  }
}

/** Delete named pages from every SW cache so next load re-fetches. */
function bustPageCache(paths) {
  if (!('caches' in window)) return;
  caches.keys().then(names => {
    names.forEach(name => {
      caches.open(name).then(cache => {
        paths.forEach(p => cache.delete(p));
      });
    });
  });
}

async function saveToIDB(storeName, data) {
  try {
    const db = await openOfflineDB();
    const tx = db.transaction([storeName], 'readwrite');
    tx.objectStore(storeName).add({
      ...data,
      synced: false,
      createdAt: new Date().toISOString()
    });
    return new Promise(resolve => {
      tx.oncomplete = () => resolve(true);
      tx.onerror    = (e) => { console.error('[IDB tx error]', e.target.error); resolve(false); };
    });
  } catch (err) {
    console.error('[IDB open error]', err);
    return false;
  }
}

function openOfflineDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('expense-tracker-db', 2);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('pending-expenses'))
        db.createObjectStore('pending-expenses', { keyPath: 'id', autoIncrement: true });
      if (!db.objectStoreNames.contains('pending-debts'))
        db.createObjectStore('pending-debts', { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
}

/** Inline banner — replaces all alert() calls. Auto-dismisses in 5s. */
function showBanner(message, type = 'info') {
  const old = document.getElementById('sync-banner');
  if (old) old.remove();

  const colors = {
    warning: { bg: '#fff3cd', color: '#856404', border: '#ffc107' },
    danger:  { bg: '#f8d7da', color: '#721c24', border: '#f5c6cb' },
    success: { bg: '#d4edda', color: '#155724', border: '#c3e6cb' },
    info:    { bg: '#d1ecf1', color: '#0c5460', border: '#bee5eb' },
  };
  const c = colors[type] || colors.info;

  const el = document.createElement('div');
  el.id = 'sync-banner';
  el.style.cssText = `
    position:fixed; top:70px; left:50%; transform:translateX(-50%);
    z-index:9998; min-width:300px; max-width:90%;
    padding:12px 20px; border-radius:8px; text-align:center;
    font-weight:500; box-shadow:0 4px 12px rgba(0,0,0,.15);
    background:${c.bg}; color:${c.color}; border:1px solid ${c.border};
    transition: opacity .4s;
  `;
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }, 5000);
}
</script>

<!-- Loading Overlay for OCR -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner">
    <i class="fas fa-spinner fa-spin"></i>
    <p>Processing OCR… Please wait</p>
    <small>This may take 10–30 seconds</small>
  </div>
</div>

{% endblock %}
