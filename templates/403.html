{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 text-center">
            <div class="card border-0 shadow-lg p-5">
                <div class="display-1 text-danger mb-4">
                    <i class="fas fa-lock"></i>
                </div>
                <h1 class="display-4 fw-bold mb-3">403</h1>
                <h2 class="h3 text-danger mb-4">Access Forbidden</h2>
                
                <p class="text-muted fs-5 mb-4">
                    You don't have permission to access this resource. 
                    Please contact support if you believe this is a mistake.
                </p>
                
                <div class="alert alert-info alert-dismissible fade show" role="alert">
                    <i class="fas fa-shield-alt"></i>
                    <strong>Security Notice:</strong> This action requires proper authorization.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <div class="d-flex gap-3 justify-content-center">
                    <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-lg">
                        <i class="fas fa-home"></i> Go to Dashboard
                    </a>
                    <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-lg">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .min-vh-100 {
        min-height: 100vh;
    }
    
    .card {
        border-radius: 15px;
        backdrop-filter: blur(10px);
    }
</style>
{% endblock %}
