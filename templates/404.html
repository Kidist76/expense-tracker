{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 text-center">
            <div class="card border-0 shadow-lg p-5">
                <div class="display-1 text-warning mb-4">
                    <i class="fas fa-search"></i>
                </div>
                <h1 class="display-4 fw-bold mb-3">404</h1>
                <h2 class="h3 text-danger mb-4">Page Not Found</h2>
                
                <p class="text-muted fs-5 mb-4">
                    Sorry, the page you're looking for doesn't exist. 
                    It may have been moved or deleted.
                </p>
                
                <div class="d-flex gap-3 justify-content-center">
                    <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-lg">
                        <i class="fas fa-home"></i> Go to Dashboard
                    </a>
                    <a href="{{ url_for('view_transactions') }}" class="btn btn-outline-primary btn-lg">
                        <i class="fas fa-list"></i> View Transactions
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .min-vh-100 {
        min-height: 100vh;
    }
    
    .card {
        border-radius: 15px;
        backdrop-filter: blur(10px);
    }
</style>
{% endblock %}
